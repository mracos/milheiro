name: build

# Validates and builds installable zips on every push (and on demand). On main,
# each build is published as a prerelease so the zips live on the Releases page
# (not just as run artifacts). Safari isn't here (needs macOS + Xcode).
on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run check # format + lint + typecheck + tests
      - run: npx wxt zip
      - run: npx wxt zip -b firefox
      - uses: actions/upload-artifact@v4
        with:
          name: milheiro-${{ github.sha }}
          path: .output/*.zip
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: build ${{ github.run_number }}
          prerelease: true
          files: .output/*.zip
